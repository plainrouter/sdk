name: Live smoke

on:
  pull_request:
    paths:
      - .github/workflows/live-smoke.yml
      - scripts/live-smoke.*
      - packages/sdk/**
      - packages/python/**
      - packages/ruby/**
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript SDK against the live API
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify pinned npm
        run: test "$(corepack npm --version)" = "11.19.0"
      - run: corepack npm ci
      - run: corepack npm run build
      - name: Smoke test against the live API
        env:
          PLAINROUTER_SMOKE_SECRET: ${{ secrets.PLAINROUTER_SMOKE_SECRET }}
        run: corepack npm run smoke:live

  python:
    name: Python SDK against the live API
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: packages/python/requirements-dev.txt
      - name: Install pinned Python dependencies
        working-directory: packages/python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Smoke test against the live API
        env:
          PLAINROUTER_SMOKE_SECRET: ${{ secrets.PLAINROUTER_SMOKE_SECRET }}
        run: python scripts/live-smoke.py

  ruby:
    name: Ruby SDK against the live API
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master, 2026-08-27
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: packages/ruby
      - name: Smoke test against the live API
        working-directory: packages/ruby
        env:
          PLAINROUTER_SMOKE_SECRET: ${{ secrets.PLAINROUTER_SMOKE_SECRET }}
        run: bundle exec ruby -Ilib ../../scripts/live-smoke.rb
