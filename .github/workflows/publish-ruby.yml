name: Publish Ruby gem

on:
  push:
    tags:
      - 'ruby-v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish to RubyGems
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master, 2026-08-27
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: packages/ruby
      - name: Verify tag, package version, and signed contract
        run: ruby scripts/verify-ruby-release.rb
      - name: Test without network
        working-directory: packages/ruby
        run: bundle exec rake test
      - name: Build and inspect gem
        working-directory: packages/ruby
        run: bundle exec rake build verify_package
      - name: Publish with trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1, 2026-08-08
        with:
          working-directory: packages/ruby
