name: Publish packages

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Verify, pack, and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify npm version
        run: test "$(corepack npm --version)" = "11.19.0"
      - name: Clean install
        run: corepack npm ci
      - name: Verify release versions and tag owner
        run: corepack npm run verify:release
      - name: Verify signed contract
        run: corepack npm run verify:spec
      - name: Typecheck
        run: corepack npm run typecheck
      - name: Test
        run: corepack npm test
      - name: Build
        run: corepack npm run build
      - name: Verify generated SDK drift
        run: |
          corepack npm run generate
          git diff --exit-code -- packages/sdk/src/generated
      - name: Pack SDK
        run: |
          mkdir -p build/npm
          corepack npm pack --workspace @plainrouter/sdk --json --pack-destination build/npm > build/npm/sdk-pack.json
          node scripts/verify-pack.mjs build/npm/sdk-pack.json sdk SDK_TARBALL
      - name: Pack CLI
        run: |
          corepack npm pack --workspace @plainrouter/cli --json --pack-destination build/npm > build/npm/cli-pack.json
          node scripts/verify-pack.mjs build/npm/cli-pack.json cli CLI_TARBALL
      - name: Publish SDK with provenance
        run: corepack npm publish "$SDK_TARBALL" --access public --provenance
      - name: Publish CLI with provenance
        run: corepack npm publish "$CLI_TARBALL" --access public --provenance

  post-publish-smoke:
    name: Install published packages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify published packages
        run: node scripts/post-publish-smoke.mjs
