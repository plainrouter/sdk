name: Generate drift

on:
  pull_request:
    paths:
      - spec/**
      - packages/cli/**
      - packages/sdk/**
      - openapi-ts.config.ts
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  generate-drift:
    name: Generated SDK is current
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: git diff --exit-code -- packages/sdk/src/generated
