name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify pinned npm
        run: test "$(corepack npm --version)" = "11.19.0"
      - run: corepack npm ci
      - run: corepack npm run verify:spec
      - run: corepack npm run typecheck
      - run: corepack npm test
      - run: corepack npm run build

  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.16', '3.12.14', '3.13.15', '3.14.7']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/requirements-dev.txt
      - name: Install pinned Python dependencies
        working-directory: packages/python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        working-directory: packages/python
        run: >-
          ruff check .
          ../../scripts/post-publish-python-smoke.py
          ../../scripts/verify-python-dist.py
          ../../scripts/verify-python-release.py
      - name: Strict typecheck
        working-directory: packages/python
        run: >-
          mypy src tests
          ../../scripts/post-publish-python-smoke.py
          ../../scripts/verify-python-dist.py
          ../../scripts/verify-python-release.py
      - name: Test without network
        working-directory: packages/python
        run: pytest
      - name: Build and inspect distributions
        if: matrix.python-version == '3.11.16'
        working-directory: packages/python
        run: |
          python -m build
          twine check dist/*
          python ../../scripts/verify-python-dist.py dist/*.whl dist/*.tar.gz

  production-install:
    name: Production install parity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify pinned npm
        run: test "$(corepack npm --version)" = "11.19.0"
      - run: corepack npm ci
      - run: corepack npm run build
      - run: corepack npm prune --omit=dev
      - run: corepack npm run smoke:production
      - run: node packages/cli/bin/plainrouter.js --help

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - run: /tmp/gitleaks git --redact --verbose .
