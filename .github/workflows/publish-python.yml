name: Publish Python package

on:
  push:
    tags:
      - 'python-v*.*.*'

jobs:
  build-python:
    name: Verify and build distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: packages/python/requirements-dev.txt
      - name: Install pinned Python dependencies
        working-directory: packages/python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify release tag, versions, and signed contract
        run: python scripts/verify-python-release.py
      - name: Lint
        working-directory: packages/python
        run: >-
          ruff check .
          ../../scripts/post-publish-python-smoke.py
          ../../scripts/verify-python-dist.py
          ../../scripts/verify-python-release.py
      - name: Strict typecheck
        working-directory: packages/python
        run: >-
          mypy src tests
          ../../scripts/post-publish-python-smoke.py
          ../../scripts/verify-python-dist.py
          ../../scripts/verify-python-release.py
      - name: Test without network
        working-directory: packages/python
        run: pytest
      - name: Verify generated Python SDK drift
        run: |
          openapi-python-client generate \
            --path spec/openapi.json \
            --config packages/python/openapi-python-client.json \
            --meta none \
            --output-path packages/python/src/plainrouter/generated \
            --overwrite \
            --fail-on-warning
          git diff --exit-code -- packages/python/src/plainrouter/generated
      - name: Build wheel and source distribution
        working-directory: packages/python
        run: python -m build
      - name: Validate and inspect distributions
        working-directory: packages/python
        run: |
          twine check dist/*
          python ../../scripts/verify-python-dist.py dist/*.whl dist/*.tar.gz
      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: Publish to PyPI with OIDC
    needs: build-python
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/plainrouter
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: packages/python/dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/
          attestations: true

  post-publish-smoke:
    name: Install published Python package
    needs: publish-python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'
      - name: Install and import released package
        run: python scripts/post-publish-python-smoke.py
