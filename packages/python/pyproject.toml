[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plainrouter"
version = "0.5.2"
description = "Python SDK and command-line interface for the signed PlainRouter OpenAPI contract"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "PlainRouter" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "attrs>=22.2.0",
    "httpx>=0.23.1,<0.29.0",
]

[project.scripts]
plainrouter = "plainrouter.cli:main"

[project.urls]
Homepage = "https://plainrouter.com"
Documentation = "https://plainrouter.com/docs/sdk/python"
Repository = "https://github.com/plainrouter/sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/plainrouter"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/plainrouter",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "plainrouter.generated.*"
disable_error_code = ["redundant-cast"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
